name: irods-redis-test-docker-4-3-3

services:
  # iRODS PostgreSQL Catalog
  irods-catalog:
    image: cyverse/irods-test-docker-catalog:v4.3.3
    environment:
      - POSTGRES_PASSWORD=testpassword
    restart: always
    networks:
      - irods-redis

  # iRODS Catalog Provider
  irods-catalog-provider:
    image: cyverse/irods-test-docker-catalog-provider:v4.3.3
    shm_size: 500mb
    healthcheck:
      test: ["CMD", "su", "-", "irods", "-c", "./irodsctl status | grep Process"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 20s
      start_interval: 10s
    restart: always
    ports:
      - "1247:1247"
      - "20000-20199:20000-20199"
    depends_on:
      - irods-catalog
    networks:
      - irods-redis

  # Redis Cache Backend
  redis:
    image: redis:7-alpine
    container_name: irods-redis-cache
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: always
    networks:
      - irods-redis

  # Redis Commander UI for visualization
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: irods-redis-commander
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - irods-redis

volumes:
  redis-data:
    driver: local

networks:
  irods-redis:
    driver: bridge
